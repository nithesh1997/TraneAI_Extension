<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TraneAI Admin Grid</title>
  <style nonce="${nonce}">
    ${styleCss}
  </style>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css" />
</head>
<body>
  <!-- Topbar -->
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" class="search-box" id="searchInput" placeholder="Search folders or files..." />
    </div>
    <div class="toolbar-btns">
      <button class="btn btn-blue" id="addFolderBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
        Add Folder
      </button>
      <button class="btn btn-green" id="addFileBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
        Upload File
      </button>
      <input type="file" id="fileUploadInput" style="display:none;" accept=".md,.json,.txt,.enc" />
      <button class="btn btn-dark" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
        Refresh
      </button>
    </div>
  </div>
  
  <div class="main-container">
    <!-- View 1: Explorer View (Grid + Right Sidebar) -->
    <div id="viewExplorer" class="view active">
      <div class="explorer">
        <div id="explorerGrid">
          <div class="empty-state"><p>Loading workspace...</p></div>
        </div>
      </div>
      <div class="sidebar">
        <div class="sidebar-header">Details</div>
        <div id="sidebarContent" class="sidebar-content-wrapper"></div>
      </div>
    </div>
    
    <!-- View 2: File Editor (Full width) -->
    <div id="viewEditor" class="view">
      <div class="editor-header">
        <button class="btn-back" id="editorBackBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back
        </button>
        <div class="editor-title">
          <svg class="file-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span id="editorFileName">file.json</span>
        </div>
        <div class="editor-meta">Version <span id="editorVersion">1</span></div>
        <button class="btn btn-blue" id="editorSaveBtn">Save</button>
      </div>
      <div class="editor-tabs">
        <button class="tab active" data-tab="edit">Editor</button>
        <button class="tab" data-tab="preview">Preview</button>
        <button class="tab" data-tab="history">History</button>
      </div>
      <div class="editor-body">
        <div id="monacoContainer"></div>
        <div id="previewContainer" style="display:none; padding:20px; white-space:pre-wrap; color:#ddd; font-family:monospace; overflow-y:auto; height:100%;"></div>
        <div id="historyContainer" style="display:none; padding:20px; color:#ddd; height:100%;">No history available.</div>
      </div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="contextMenu" class="context-menu"></div>

  <!-- RequireJS for Monaco -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
  
  <script nonce="${nonce}">
    const projectName = "${projectName}";
    ${appJs}
  </script>
</body>
</html>
